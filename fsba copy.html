<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Slider Fill (Gray)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tắt khử răng cưa để nét pixel vuông vức */
        * { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-gray-600 h-screen flex flex-col items-center justify-center">

    <h1 class="text-white font-mono text-lg mb-6">Cắt cái này làm FILL (Màu xám):</h1>
    
    <!-- Hình FILL (Ruột màu xám) -->
    <div class="flex flex-col items-center">
        <!-- Cạnh trên cùng -->
        <div class="w-[304px] h-[4px] bg-black"></div>
        <!-- Bo góc trên -->
        <div class="w-[312px] h-[4px] bg-gray-400 border-x-[4px] border-black"></div>
        <!-- Thân giữa màu xám -->
        <div class="w-[320px] h-[32px] bg-gray-400 border-x-[4px] border-black"></div>
        <!-- Bo góc dưới -->
        <div class="w-[312px] h-[4px] bg-gray-400 border-x-[4px] border-black"></div>
        <!-- Cạnh dưới cùng -->
        <div class="w-[304px] h-[4px] bg-black"></div>
    </div>

</body>
</html>
